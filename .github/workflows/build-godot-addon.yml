name: Build Godot OranVid addon

on:
  push:
    paths:
      - "addons/**"
      - "native/core/**"
      - ".github/workflows/build-godot-addon.yml"
  pull_request:
    paths:
      - "addons/**"
      - "native/core/**"
      - ".github/workflows/build-godot-addon.yml"
  workflow_dispatch:

jobs:
  windows-x86_64:
    runs-on: windows-latest
    steps:
      - name: Checkout addon repository
        uses: actions/checkout@v4

      - name: Checkout Godot C++ bindings
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-cpp
          ref: master
          path: godot-cpp

      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip

      - name: Install SCons
        shell: msys2 {0}
        run: python -m pip install scons

      - name: Build GDExtension for Godot 4.7
        shell: msys2 {0}
        run: >-
          scons -C addons/oranvid
          platform=windows
          target=template_release
          arch=x86_64
          use_mingw=yes
          -j2

      - name: Verify extension output
        shell: pwsh
        run: |
          $library = "addons/oranvid/bin/windows/oranvid.windows.template_release.x86_64.dll"
          if (-not (Test-Path $library)) {
            throw "Expected GDExtension output was not generated: $library"
          }

      - name: Package addon
        shell: pwsh
        run: |
          Compress-Archive -Path addons/oranvid -DestinationPath oranvid-godot-addon-windows-x86_64.zip -Force

      - name: Upload compiled addon
        uses: actions/upload-artifact@v4
        with:
          name: oranvid-godot-addon-windows-x86_64
          path: oranvid-godot-addon-windows-x86_64.zip
          if-no-files-found: error
